services:
  - type: web
    name: api-motor-metas
    env: python
    plan: free
    autoDeploy: true
    rootDir: API-motor-metas
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api_server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      # Front local (Vite) apontando para API no Render. Inclua a URL do front
      # de staging/prod aqui quando existir (vírgula, sem barra no final).
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
