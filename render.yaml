services:
  - type: web
    name: api-motor-metas
    env: python
    plan: free
    autoDeploy: true
    rootDir: API-motor-metas
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api_server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
